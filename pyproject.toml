[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bogle"
version = "0.1.0"
description = "CLI tool for passive portfolio rebalancing"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9",
    "psycopg[binary]>=3.1",
    "yoyo-migrations>=9.0",
    "rich>=13.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "yfinance>=0.2.40",
    "plotext>=5.2",
    "plotly>=5.20",
    "textual>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
bogle = "bogle.cli:_run"
bo = "bogle.cli:_run"      # alias curto, no espirito do `mo` do mole

[tool.hatch.build.targets.wheel]
packages = ["src/bogle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real external APIs; deselected by default (run with -m live).",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/node_modules",
    "build",
    "dist",
    "**/migrations",
]
reportUnreachable = "warning"
reportImplicitOverride = "warning"
