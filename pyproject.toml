[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bogle"
version = "0.1.0"
description = "CLI tool for passive portfolio rebalancing"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9",
    "psycopg[binary]>=3.1",
    "yoyo-migrations>=9.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bogle = "bogle.cli:_run"

[tool.hatch.build.targets.wheel]
packages = ["src/bogle"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/node_modules",
    "build",
    "dist",
    "**/migrations",
]
reportUnreachable = "warning"
reportImplicitOverride = "warning"
